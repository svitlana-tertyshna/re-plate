info:
  name: 03 - Get Adaptation by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/adaptations/{{adaptationId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("GET returns 200 OK", () => {
            expect(res.getStatus()).to.equal(200);
        });

        test("Retrieved adaptation matches the created adaptation", () => {
            const body = res.getBody();

            expect(body.id).to.equal(bru.getVar("adaptationId"));
            expect(body.goal).to.equal("VEGAN");
            expect(body.recipe.title).to.be.a("string").and.not.empty;
            expect(body.recipe.ingredients).to.be.an("array").that.is.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200-adaptation-retrieved
    request:
      url: "{{baseUrl}}/api/v1/adaptations/{{adaptationId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Tue, 03 Nov 2026 14:39:34 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "id": "f8cd9001-a632-4e77-b41f-940273da019c",
            "goal": "VEGAN",
            "recipe": {
              "title": "Vegan Pasta with Tofu and Cream",
              "ingredients": [
                "200 g pasta",
                "150 g firm tofu",
                "100 ml coconut cream or cashew cream"
              ],
              "instructions": [
                "Cook the pasta according to package instructions.",
                "Cube the tofu and fry it until golden brown.",
                "Add the coconut cream or cashew cream to the tofu and stir well.",
                "Combine the cooked pasta with the tofu mixture."
              ],
              "changes": [
                "Replaced chicken breast with 150 g of firm tofu.",
                "Replaced dairy cream with 100 ml of coconut cream or cashew cream."
              ],
              "warnings": [
                "Make sure to use firm tofu for the best texture.",
                "Check for dairy-free labels on coconut or cashew cream to ensure they are vegan."
              ]
            }
          }
