
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: replate
          POSTGRES_USER: replate
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U replate -d replate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REPLATE_DB_URL: jdbc:postgresql://localhost:5433/replate
      REPLATE_DB_USER: replate
      REPLATE_DB_PASSWORD: ci_test_password

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        run: bash ./mvnw --batch-mode clean test
