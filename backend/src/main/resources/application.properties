spring.application.name=backend

# PostgreSQL connection
spring.datasource.url=${REPLATE_DB_URL:jdbc:postgresql://localhost:5433/replate}
spring.datasource.username=${REPLATE_DB_USER:replate}
spring.datasource.password=${REPLATE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

# Keep external AI models disabled by default
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
